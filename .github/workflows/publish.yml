name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Re-run the full CI (tests, lint, type-check, dependency audit) against the
  # release tag so nothing reaches PyPI unless it passes.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The tag goes through env, never interpolated into the script.
      - name: Check release tag matches pyproject version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'EOF'
          import os
          import tomllib

          tag = os.environ["TAG"]
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if tag.removeprefix("v") != version:
              raise SystemExit(f"Release tag {tag!r} does not match pyproject version {version!r}")
          EOF

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: [ci, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  mcpb:
    # The bundle installs the matching release from PyPI on first launch, so
    # only attach it once the PyPI publish has succeeded. It was built by the
    # ci job's package step (artifacts of a called workflow belong to this run).
    needs: [ci, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: dist/

      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        # No --clobber: it deletes the existing asset before uploading, so a
        # failed rerun could leave the published release without its bundle.
        run: |
          ASSET=$(basename dist/*.mcpb)
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$ASSET"; then
            echo "$ASSET already attached; skipping upload."
          else
            gh release upload "$TAG" dist/*.mcpb
          fi

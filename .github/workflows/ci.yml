name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # publish.yml runs this whole workflow as a gate before publishing.
  workflow_call:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type-check with mypy
        run: mypy src/

      - name: Run tests
        run: python -m pytest tests/ -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Audit what garmin-py ships (runtime + mcp extra). pip-audit runs
      # isolated via pipx, so PIPAPI_PYTHON_LOCATION points it at this job's
      # interpreter instead of its own environment. That interpreter's own pip
      # is audited too, so upgrade it first: a stale runner pip must not block
      # a release (publish.yml gates on this job).
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[mcp]"

      - name: Audit dependencies for known vulnerabilities
        run: PIPAPI_PYTHON_LOCATION="$(command -v python)" pipx run pip-audit==2.10.1

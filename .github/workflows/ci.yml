name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # publish.yml runs this whole workflow as a gate before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Lint with ruff
        if: runner.os == 'Linux'
        run: ruff check src/ tests/

      - name: Type-check with mypy
        if: runner.os == 'Linux'
        # Separate runs: mcpb/main.py and scripts/ are standalone files, not
        # part of the garmin_cli package.
        run: |
          mypy src/
          mypy mcpb/ scripts/

      - name: Run tests
        run: python -m pytest tests/ -q

  package:
    name: Package smoke (wheel without [mcp], .mcpb build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      # A clean venv with only the CLI: the console script must not need mcp.
      - name: Smoke-test the CLI-only wheel
        run: |
          python -m venv "$RUNNER_TEMP/cli-only"
          "$RUNNER_TEMP/cli-only/bin/pip" install dist/*.whl
          if "$RUNNER_TEMP/cli-only/bin/python" -c "import mcp" 2>/dev/null; then
            echo "mcp is installed; the smoke test must run without the [mcp] extra" >&2
            exit 1
          fi
          "$RUNNER_TEMP/cli-only/bin/garmin-cli" --version
          "$RUNNER_TEMP/cli-only/bin/garmin-cli" --help

      # Never published from here. On a release, publish.yml (which calls this
      # workflow) attaches this same artifact, so the shipped bundle is the
      # one built before the PyPI upload.
      - name: Build Claude Desktop bundle
        run: python scripts/build_mcpb.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: dist/*.mcpb
          if-no-files-found: error

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # Audit what garmin-py ships (runtime + mcp extra). pip-audit runs
      # isolated via pipx, so PIPAPI_PYTHON_LOCATION points it at this job's
      # interpreter instead of its own environment. That interpreter's own pip
      # is audited too, so upgrade it first: a stale runner pip must not block
      # a release (publish.yml gates on this job).
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[mcp]"

      - name: Audit dependencies for known vulnerabilities
        run: PIPAPI_PYTHON_LOCATION="$(command -v python)" pipx run pip-audit==2.10.1
